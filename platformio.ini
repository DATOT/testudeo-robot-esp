; PlatformIO Project Configuration File
[env:esp32-s3-devkitc-1-n16r8v]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
build_unflags =
  -std=gnu++11
  -std=gnu++14
  -std=gnu++17
build_flags =
  -I include
  -I lib/Device/Devices
  -I .pio/libdeps/esp32-s3-devkitc-1-n16r8v/esp-dsp/modules/fft/include
  -I .pio/libdeps/esp32-s3-devkitc-1-n16r8v/esp-dsp/modules/common/include
  -std=gnu++2a
lib_deps =
  madhephaestus/ESP32Servo@^3.2.1
  bitbank2/bb_spi_lcd@^2.9.9
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.0.4
test_framework = unity
